name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - uses: actions/cache@v4
        with:
          path: .cache/edid-decode
          key: edid-decode-${{ hashFiles('scripts/build-edid-decode.sh') }}
      - name: Build edid-decode (pinned, MIT)
        run: scripts/build-edid-decode.sh
      - name: Unit tests, including edid-decode cross-checks
        run: pnpm test
        env:
          EDID_DECODE: ${{ github.workspace }}/.cache/edid-decode/edid-decode
      - name: Fail if the edid-decode tests were skipped
        run: pnpm vitest run packages/edid-core/test/edid-decode.test.ts --reporter=verbose | tee /tmp/ed.txt && ! grep -q "skipped" /tmp/ed.txt
        env:
          EDID_DECODE: ${{ github.workspace }}/.cache/edid-decode/edid-decode

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @edid-studio/web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: packages/web/test-results/
          retention-days: 7
